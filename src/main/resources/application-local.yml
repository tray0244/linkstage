# local 프로필 — docker-compose로 띄운 MySQL / Redis에 붙는다.
# 테스트는 이 주소를 쓰지 않는다 (Testcontainers가 연결 정보를 덮어쓴다).
# 테스트 전용 API(토큰 발급, 회차 좌석 초기화)는 이 프로필에서만 켠다.
spring:
  datasource:
    url: jdbc:mysql://localhost:3307/stage?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: stage
    password: stage
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    hibernate:
      # 테이블은 Flyway SQL로만 만든다. 엔티티와 테이블이 어긋나면 앱이 뜨지 않는다.
      ddl-auto: validate
