spring:
  application:
    name: stage
  profiles:
    default: local
  jpa:
    # 컨트롤러에서 지연 로딩을 하지 않는다. 조회는 서비스의 트랜잭션 안에서 끝낸다.
    open-in-view: false

app:
  queue:
    # 대기열 스위치 (앱 전체). 환경 변수 APP_QUEUE_ENABLED로 덮어쓸 수 있다.
    # false면 줄 서기가 바로 ADMITTED를 주고 Redis에 아무것도 쓰지 않는다.
    enabled: ${APP_QUEUE_ENABLED:true}
    # 정원 M: 입장 명단(queue_active)에 동시에 있을 수 있는 최대 인원
    capacity: 100
    # 하드캡: 한 번(1초) 배출에서 입장시키는 최대 인원
    hard-cap: 20
    # 입장 유지 시간: 입장 명단에서 이 시간이 지나면 빠진다
    admission-ttl: 5m
    # 1초마다 도는 배출 스케줄러를 켤지 정한다. 대기열 스위치(enabled)와 다르다.
    # 운영에서 대기열을 켜고 끄는 값이 아니라, 테스트에서 스케줄러를 멈추기 위한 값이다.
    # 운영과 로컬은 true로 두고, 테스트는 src/test/resources/application.properties에서 false로 둔다.
    scheduler-enabled: true
