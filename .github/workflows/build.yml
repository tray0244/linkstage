name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # Gradle 캐시는 이 액션이 맡는다.
      - uses: gradle/actions/setup-gradle@v6
      # 테스트는 Testcontainers가 MySQL·Redis를 직접 띄운다 (러너에 Docker 기본 설치).
      - run: ./gradlew build
